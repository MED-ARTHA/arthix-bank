spring.application.name=arthix-backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:8080/arthix_bank
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.error.include-message=always
server.error.include-binding-errors=always

logging.level.org.springframework.security=DEBUG

app.jwt.secret=ZmFrZS1zZWNyZXQtZm9yLWRldi1vbmx5LWNoYW5nZS1tZS0xMjM0NTY3ODkw
app.jwt.expiration-ms=86400000

# media uploads (stored on disk, never in git)
app.media.dir=${MEDIA_DIR:uploads}
spring.servlet.multipart.max-file-size=26MB
spring.servlet.multipart.max-request-size=27MB

# email verification (leave MAIL_USER empty in dev: the code is printed in the console)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_USER:no-reply@arthix.local}

# AI assistant (key stays in the environment, never in git)
app.ai.key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
